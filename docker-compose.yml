# ramiza.site - 3-tier app
#
# Traffic path on AWS:
#   ramiza.site -> CloudFront -> ALB (:80) -> EC2 host :80 -> frontend (Nginx :80)
#                                                              |-- /       -> static HTML/CSS/JS
#                                                              |-- /api/*  -> backend (Node :5000) -> db (MySQL :3306)
#
# Only the frontend publishes a port on the host (80), because that is the port
# the ALB target group sends traffic to. The backend and the database are reachable
# only inside Docker's private networks, never from the internet.

services:
  # ---------- Tier 3: Database ----------
  db:
    image: mysql:8.0
    container_name: ramiza-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ramiza}
      MYSQL_USER: ${MYSQL_USER:-ramiza_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    command:
      # Keeps MySQL's memory use small enough for a t2.micro / t3.micro (1 GB RAM)
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - backend-net

  # ---------- Tier 2: Backend API ----------
  backend:
    build: ./backend
    container_name: ramiza-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-ramiza}
      DB_USER: ${MYSQL_USER:-ramiza_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net

  # ---------- Tier 1: Frontend (Nginx) ----------
  frontend:
    build: ./frontend
    container_name: ramiza-frontend
    restart: unless-stopped
    ports:
      - "80:80"   # EC2 host port 80 <- ALB target group port 80
    depends_on:
      - backend
    networks:
      - frontend-net

volumes:
  db_data:

networks:
  frontend-net:   # frontend <-> backend
  backend-net:    # backend  <-> database (frontend cannot reach the DB)
