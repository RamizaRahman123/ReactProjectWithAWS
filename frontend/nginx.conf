server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS. Resolving "backend" per request (instead of at startup)
    # means Nginx still starts even if the backend container is restarting.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Lightweight check that does not touch the backend or database
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Tier 2: everything under /api/ goes to the Node backend on port 5000
    location /api/ {
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Never let CloudFront or browsers cache API responses
        add_header Cache-Control "no-store" always;
    }

    # Tier 1: static frontend files
    location / {
        try_files $uri $uri/ /index.html;
    }
}
